services:
  - type: web
    name: onfire-website
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: onfire_db
      - key: DB_PORT
        value: 3306
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
